[package]
name = "drumgrid"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["xtask"]

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = "thin"
strip = true

[dependencies]
hound = "3.5.1"
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["assert_process_allocs"], rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
parking_lot = "0.12"
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
rfd = "0.14"
